name: Sync catalog from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync catalog
        run: node scripts/sync-catalog.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/db.json; then
            echo "No changes to commit"
          else
            git add data/db.json
            git commit -m "Sync catalog from Google Sheets [skip ci]"
            git push
          fi
